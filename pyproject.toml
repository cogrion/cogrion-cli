[project]
name = "cogrion-cli"
version = "1.0.0"
description = "Developer CLI for the Cogrion BYOC platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer==0.27.0",
    "rich==15.0.0",
    "questionary==2.1.1",
]

[project.scripts]
cogrion = "cogrion_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cogrion_cli"]

[dependency-groups]
dev = [
    "black==26.5.1",
    "pytest==9.1.1",
]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
