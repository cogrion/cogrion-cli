[project]
name = "cogrion-cli"
version = "0.1.0"
description = "Developer CLI for the Cogrion BYOC platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "questionary>=2.0.0",
]

[project.scripts]
cogrion = "cogrion_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cogrion_cli"]

[dependency-groups]
dev = [
    "black>=25.0.0",
    "pytest>=8.3.0",
]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
